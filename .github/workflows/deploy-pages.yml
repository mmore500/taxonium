name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/add-alife-parquet-support-H5x7F]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and build component
        working-directory: taxonium_component
        run: npm install && npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      - name: Install and build website
        working-directory: taxonium_website
        run: npm install --ignore-scripts --force && npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: taxonium_website/dist
      - uses: actions/deploy-pages@v4
        id: deployment
