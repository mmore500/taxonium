<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      // GitHub Pages SPA redirect: store the path and redirect to index
      // The main app reads sessionStorage.ghPagesRedirect on load
      var pathSegmentsToKeep = 1; // keep /taxonium
      var l = window.location;
      sessionStorage.setItem('ghPagesRedirect',
        l.pathname.slice(1) + l.search + l.hash
      );
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/'
      );
    </script>
  </head>
  <body></body>
</html>
